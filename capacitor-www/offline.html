<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>LingoFox</title>
    <script src="app-url.js"></script>
    <style>
      body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 24px; box-sizing: border-box; background: #fdfaf4; font-family: system-ui, sans-serif; color: #3b2a1a; text-align: center; }
      img { width: 120px; }
      h1 { font-size: 22px; margin: 0; }
      p { margin: 0; color: #7a6650; }
      button { margin-top: 8px; border: 0; border-radius: 16px; padding: 14px 28px; font-size: 17px; font-weight: 700; color: #fff; background: #fe7802; box-shadow: 0 4px 0 #c95a00; }
    </style>
  </head>
  <body>
    <img src="icon.png" alt="" />
    <h1>لا يوجد اتصال بالإنترنت</h1>
    <p>تحقّق من الاتصال ثم حاول مرة أخرى.</p>
    <p dir="ltr">No internet connection — check it and try again.</p>
    <button type="button" onclick="location.replace(window.LINGOFOX_APP_URL)">حاول مرة أخرى · Retry</button>
  </body>
</html>
